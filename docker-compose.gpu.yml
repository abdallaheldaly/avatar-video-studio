# NVIDIA GPU (needs the NVIDIA Container Toolkit; works on Linux and Windows 11 + Docker Desktop with WSL2).
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
  studio:
    build:
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu121
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
